<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BUR BUR WORLD</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
      #app { position: fixed; inset: 0; }

      /* ── Puerta de entrada: una semilla que respira ──────────────────────── */
      #overlay {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #05070a; cursor: pointer; z-index: 10;
        transition: opacity 1s ease .25s;   /* al entrar, el velo se disuelve */
      }
      #overlay.hidden { display: none; }
      #overlay.leaving { opacity: 0; }

      .gate { display: flex; flex-direction: column; align-items: center; gap: 30px; }
      /* La semilla ES el link: un área de hover generosa que la agranda al pasar. */
      .seedWrap {
        display: grid; place-items: center; width: 80px; height: 80px; cursor: pointer;
        transition: transform .55s cubic-bezier(.2, .7, .2, 1);
      }
      .seedWrap:hover { transform: scale(2); }

      /* La semilla: un punto de luz que late lento (como una luciérnaga lejana). */
      .seed {
        width: 12px; height: 12px; border-radius: 50%;
        color: #b6d184;   /* acento del mundo en curso — el JS lo va rotando */
        background: radial-gradient(circle, #f5fff7 0%, currentColor 78%, transparent 100%);
        box-shadow: 0 0 30px 10px color-mix(in srgb, currentColor 50%, transparent);
        animation: breathe 5.5s ease-in-out infinite;
        transition: color 2.6s ease;   /* el latido pasa suave de un color al otro */
      }
      @keyframes breathe {
        0%, 100% { transform: scale(.82); opacity: .8; }
        50%      { transform: scale(1.32); opacity: 1; }
      }

      /* El susurro + la invitación (aparece al acercarse). */
      .lines {
        display: flex; flex-direction: column; align-items: center; gap: 13px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .whisper { font-size: 12px; letter-spacing: .1em; color: rgba(207,232,216,.42); }
      .cta {
        font-size: 11px; text-transform: uppercase; letter-spacing: .4em; text-indent: .4em;
        color: rgba(234,255,240,0);   /* oculto: aparece al pasar por la semilla */
        transition: color .5s ease, letter-spacing .5s ease;
      }
      /* Hover sobre la semilla → ENTRA aparece (la invitación) y late más rápido. */
      .seedWrap:hover ~ .lines .cta { color: rgba(234,255,240,.95); letter-spacing: .58em; }
      .seedWrap:hover .seed { animation-duration: 3.2s; }
      /* En táctil (sin hover) ENTRA queda tenue para verse igual. */
      @media (hover: none) { .cta { color: rgba(207,232,216,.42); } }

      /* Al hacer click: la semilla se ABRE y nos atraviesa; el velo se disuelve. */
      #overlay.leaving .seed {
        animation: none;
        transition: transform 1.1s cubic-bezier(.2,.75,.2,1), box-shadow 1.1s ease, opacity 1.1s ease;
        transform: scale(64); opacity: 0;
        box-shadow: 0 0 120px 60px color-mix(in srgb, currentColor 55%, transparent);
      }
      #overlay.leaving .lines { opacity: 0; transition: opacity .35s ease; }

      @media (prefers-reduced-motion: reduce) { .seed { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay">
      <div class="gate">
        <div class="seedWrap"><div class="seed"></div></div>
        <div class="lines">
          <span class="whisper">algo respira aquí</span>
          <span class="cta">entra</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
